    // dummy json
    fetch('https://dummyjson.com/products?limit=3&skip=10') // в url прописуємо параметри після ?
        .then(response => response.json())
        .then(res => {
            console.log(res);
            let {products} = res; // дістали products
            document.write(`<div>`);
            for (const product of products) {
                document.write(`<div>`);
                document.write(`<p>${product.id} ${product.title} - ${product.price}</p>`);
                document.write(`<img src="${product.thumbnail}" alt="">`)
                document.write(`</div>`);
            }
            document.write(`</div>`);
        });

    fetch('https://dummyjson.com/products/add', { // http method POST to add new item
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            title: 'BMW Pencil',
        })
    })
        .then(res => res.json()) // тут сервер обробив і каже ось тут оновленний варіант
        .then(value => console.log(value));
