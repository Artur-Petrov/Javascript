<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Promise reject</title>
</head>
<body>

<script>

    new Promise((resolve, reject) => {
        setTimeout(() => {
            let x = 1;
            console.log(x);
            resolve(x);
        }, 1000);
    }).then((value) => {
        return new Promise((resolve, reject) => {
            setTimeout(() => {
                value++;
                console.log(value);
                if(false){
                    reject('qweqweqweqwe');
                }else{
                    resolve(value);
                }
            }, 1000);
        });
    }).catch((error) => { // error приймає нашу помилку а саме текст 'qweqweqweqwe'
        // в cathc ми обробляємо нашу помилку замість then
        console.log(error);
    })
    // і далі продовжуємо з then
    .then((value) => {
        setTimeout(() => {
            value++;
            console.log(value);
        }, 1000);
    });

</script>

</body>
</html>
